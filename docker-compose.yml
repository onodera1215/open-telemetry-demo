services:
  backend:
    container_name: backend
    build: ./backend
    volumes:
      - ./backend:/app
    ports:
      - "3333:3000"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@database:5432/demo
  frontend:
    container_name: frontend
    build: ./frontend
    volumes:
      - ./frontend:/app
  database:
    build: ./docker/database
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=demo
    volumes:
      - database_data:/var/lib/postgresql/data

volumes:
  database_data:
