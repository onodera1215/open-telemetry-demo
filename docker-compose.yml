services:
  backend:
    container_name: backend
    build: ./backend
    volumes:
      - ./backend:/app
    ports:
      - "3333:3000"
  frontend:
    container_name: frontend
    build: ./frontend
    volumes:
      - ./frontend:/app
  database:
    build: ./docker/database
    volumes:
      - database_data:/var/lib/postgresql/data

volumes:
  database_data:
