services:
  backend:
    container_name: backend
    build: ./backend
    volumes:
      - ./backend:/app
    ports:
      - "3333:3000"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@database:5432/demo
  frontend:
    container_name: frontend
    build: ./frontend
    volumes:
      - ./frontend:/app
    ports:
      - "8080:3000"
  database:
    build: ./docker/database
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=demo
    volumes:
      - database_data:/var/lib/postgresql/data
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      - LOG_LEVEL=debug

volumes:
  database_data:
